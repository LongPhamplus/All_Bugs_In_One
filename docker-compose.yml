services:
  db:
    image: mariadb:10.11-jammy
    container_name: inventory_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret123
      MYSQL_DATABASE: inventory_db
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - inventory_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventory_backend
    restart: always
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: secret123
      DB_NAME: inventory_db
      DB_PORT: 3306
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - inventory_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inventory_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - inventory_net

networks:
  inventory_net:
    driver: bridge
